server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # GIS Telemetry & Sensors service
    location /disaster-management/telemetry/ {
        proxy_pass http://gis-monitoring-service:8097/disaster-management/telemetry/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /disaster-management/sensors/ {
        proxy_pass http://gis-monitoring-service:8097/disaster-management/sensors/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Alerting service
    location /disaster-management/alerts/ {
        proxy_pass http://alerting-service:8093/disaster-management/alerts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Default disaster-management fallback
    location /disaster-management/ {
        proxy_pass http://gis-monitoring-service:8097/disaster-management/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Metadata service (THIS FIXES YOUR ERROR)
    location /metadata-api/ {
        proxy_pass http://metadata-handling-service:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MQTT service (add now to avoid future errors)
    location /mqtt-api/ {
        proxy_pass http://mqtt-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Report generating service
    location /reports/ {
        proxy_pass http://report-generating-service:8094/reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}